name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - Upgrade
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

env:
  CI: "true"
  NO_COLOR: "1"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

defaults:
  run:
    shell: bash

jobs:
  gatekeeper:
    name: Gatekeeper (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(vp exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Cache Vite Task Cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-vite-task-cache-

      - name: Setup test environment (install browser)
        run: vp run test:setup

      - name: Install Playwright system dependencies on Linux
        run: vp exec playwright install-deps chromium

      - name: Check (Oxlint & Oxfmt)
        run: vp check

      - name: Lint (Tailwind CSS)
        run: vp run agent:lint:tailwind

      - name: Check dead code (Knip)
        run: vp run check:deadcode

      - name: Run unit & component tests
        run: vp run agent:test:unit

      - name: Build production bundle
        run: vp build

      - name: Run E2E tests
        run: vp run agent:test:e2e

      - name: Upload Playwright artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-gatekeeper
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  platform-compat:
    name: Platform Compatibility (${{ matrix.os }})
    needs: gatekeeper
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Cache Vite Task Cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-vite-task-cache-

      - name: Build production bundle
        run: vp build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(vp exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Setup test environment (install browser)
        run: vp run test:setup

      - name: Run unit & smoke tests
        run: vp run agent:test:unit

      - name: Upload Playwright artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
