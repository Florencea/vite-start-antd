name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - Upgrade
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

env:
  CI: "true"
  NO_COLOR: "1"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

defaults:
  run:
    shell: bash

jobs:
  gatekeeper:
    name: Gatekeeper (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (via package.json engines)
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup environment file
        run: cp .env.example .env

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Setup test environment (install browser)
        run: npm run test:setup

      - name: Install Playwright system dependencies on Linux
        run: npx playwright install-deps chromium

      - name: Typecheck
        run: npm run agent:typecheck

      - name: Lint (ESLint)
        run: npm run agent:lint:eslint

      - name: Lint (Tailwind CSS)
        run: npm run agent:lint:tailwind

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Check dead code (Knip)
        run: npm run check:deadcode

      - name: Run unit & component tests
        run: npm run agent:test:unit

      - name: Build production bundle
        run: npm run build

      - name: Run E2E tests
        run: npm run agent:test:e2e

      - name: Upload Playwright artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-gatekeeper
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  platform-compat:
    name: Platform Compatibility (${{ matrix.os }})
    needs: gatekeeper
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (via package.json engines)
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup environment file
        run: cp .env.example .env

      - name: Build production bundle
        run: npm run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Setup test environment (install browser)
        run: npm run test:setup

      - name: Run unit & smoke tests
        run: npm run agent:test:unit

      - name: Upload Playwright artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
